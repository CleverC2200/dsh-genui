name: Company DSH

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: company-dsh-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    if: github.repository == 'CleverC2200/dsh-genui'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run check:company-dsh
      - name: Verify independent package
        id: pack
        run: node scripts/verify-pack.mjs --keep
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-genui-package
          path: ${{ steps.pack.outputs.tarball }}
          retention-days: 7
